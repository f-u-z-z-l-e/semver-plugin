# Centralized dependency version management for semver-plugin
# All build files reference versions and libraries from this catalog.

[versions]
kotlin = "2.3.10"
jgit = "7.6.0.202603022253-r"
junit-jupiter = "6.0.2"
hamcrest = "3.0"
gradle-plugin-publish = "2.1.1"
detekt = "2.0.0-alpha.2"
jacoco-testkit = "1.0.5"
ch-fuzzle-gradle-semver = "1.0.0"

[libraries]
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
jacoco-testkit = { id = "io.github.gmazzo.gradle.testkit.jacoco", version.ref = "jacoco-testkit" }
ch-fuzzle-gradle-semver = { id = "ch.fuzzle.gradle.semver", version.ref = "ch-fuzzle-gradle-semver" }
